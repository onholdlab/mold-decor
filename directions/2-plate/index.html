<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>黴菌裝潢 · 圖版</title>
<link rel="stylesheet" href="style.css">
<script src="../../locale.js"></script></head>
<body>
<div id="app">
  <p class="plate-no">圖版 I <span>Tab. I</span></p>

  <figure class="fig fig-a">
    <img src="assets/aspergillus.svg" alt="麴菌分生孢子頭">
    <figcaption><b>麴菌</b> <i>Aspergillus oryzae</i><br>頂囊球形，瓶梗單層，分生孢子鏈放射。</figcaption>
  </figure>

  <figure class="fig fig-p">
    <img src="assets/penicillium.svg" alt="青黴分生孢子柄">
    <figcaption><b>青黴</b> <i>Penicillium</i><br>分生孢子柄三層分支，不對稱；分生孢子成鏈。</figcaption>
  </figure>

  <figure class="fig fig-m">
    <img src="assets/monascus.svg" alt="紅麴菌落與閉囊殼">
    <figcaption><b>紅麴</b> <i>Monascus purpureus</i><br>菌落紅色，放射狀皺褶；閉囊殼內含子囊孢子。</figcaption>
  </figure>

  <figure class="fig fig-room">
    <img src="assets/room.svg" alt="牆角立面">
    <figcaption>圖 I–III 的採集位置。牆角立面，1 : 10。</figcaption>
  </figure>

  <p class="foot">onholdlab · 黴菌裝潢 · 第 2 輪方向 2 ／ 3</p>
</div>
<script src="scroll-lock.js"></script>
</body>
</html>
