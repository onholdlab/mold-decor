<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>黴菌裝潢 · 程式生成</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section class="stage">
    <canvas id="scene"></canvas>
    <span id="day" class="day">第 1 天</span>
    <span class="note">牆角 · 層板上的吐司 · 踢腳板。點一下，換一組種子重長。</span>
  </section>

  <section class="specimens">
    <p class="k">生長規則</p>

    <canvas data-spec="penicillium"></canvas>
    <p class="cap"><b>青黴</b> <i>Penicillium</i><span>菌絲隨機分岔 → 分生孢子柄 → 2–4 根梗基 → 瓶梗 → 孢子鏈。每根柄的分支數、角度、鏈長都由亂數決定。</span></p>

    <canvas data-spec="aspergillus"></canvas>
    <p class="cap"><b>麴菌</b> <i>Aspergillus oryzae</i><span>柄 → 頂囊 → 放射狀孢子鏈，覆蓋 200–320 度，偏向一側。</span></p>

    <canvas data-spec="monascus"></canvas>
    <p class="cap"><b>紅麴</b> <i>Monascus</i><span>Eden 擴張模型：從一格開始，每次挑邊界長一格；加上方向偏好，菌落會長出瓣與皺邊。深點是閉囊殼。</span></p>
  </section>

  <p class="foot">onholdlab · 黴菌裝潢 · 第 2 輪方向 1 ／ 3</p>
</div>
<script src="assets/growth.js"></script>
<script src="assets/scene.js"></script>
<script src="scroll-lock.js"></script>
</body>
</html>
