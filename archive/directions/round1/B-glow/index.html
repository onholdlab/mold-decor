<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b1026">
<title>黴菌裝潢 · 方向 B 深夜生物光</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="hero">
    <p class="eyebrow">方向 B</p>
    <h1>深夜生物光</h1>
    <p class="lead">關燈之後，房間裡的黴菌才開始發光。<br>像深海珊瑚，安靜地把牆角照亮。</p>
  </header>

  <section class="molds">
    <figure>
      <img src="assets/penicillium.svg" alt="青黴" class="float">
      <figcaption>
        <b>青黴</b><i>Penicillium</i>
        <span>刷子狀的孢子柄會發出青綠色微光。涼、濕、有麵包就來。</span>
      </figcaption>
    </figure>
    <figure>
      <img src="assets/aspergillus.svg" alt="麴菌" class="float f2">
      <figcaption>
        <b>麴菌</b><i>Aspergillus oryzae</i>
        <span>圓圓的孢子頭像一盞盞小燈籠。溫暖的米和豆子是它的家。</span>
      </figcaption>
    </figure>
    <figure>
      <img src="assets/monascus.svg" alt="紅麴" class="float f3">
      <figcaption>
        <b>紅麴</b><i>Monascus</i>
        <span>鋪開來像夜光的潮汐，一顆顆亮點是它的閉囊殼。</span>
      </figcaption>
    </figure>
  </section>

  <section class="room">
    <h2>停電的颱風夜</h2>
    <p class="hint">除濕機沒電了，剛好。</p>
    <div class="scene">
      <img src="assets/room.svg" alt="" class="bg">
      <span class="light l-teal"></span>
      <span class="light l-amber"></span>
      <span class="light l-pink"></span>
      <img src="assets/penicillium.svg" alt="青黴長在吐司上" class="mold on-bread">
      <img src="assets/aspergillus.svg" alt="麴菌掛在牆角" class="mold on-wall">
      <img src="assets/monascus.svg" alt="紅麴住在米罐裡" class="mold in-jar">
    </div>
  </section>

  <footer>
    <p>ONHOLDLAB · 黴菌裝潢（暫名）· 美術方向草稿 2／3</p>
  </footer>
</div>
<script src="scroll-lock.js"></script>
</body>
</html>
