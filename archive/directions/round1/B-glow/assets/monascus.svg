<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="body" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#ffc3e0"/>
      <stop offset="0.5" stop-color="#ff4f9a"/>
      <stop offset="1" stop-color="#5a0f3c"/>
    </radialGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#ffb3d6"/>
      <stop offset="1" stop-color="#ff4f9a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <style>
      .tw { animation: tw 2.8s ease-in-out infinite; }
      .t2 { animation-delay:-.9s } .t3 { animation-delay:-1.8s } .t4 { animation-delay:-2.3s }
      @keyframes tw { 0%,100% { opacity:.35; } 50% { opacity:1; } }
      .breathe { transform-origin: 100px 150px; animation: br 6s ease-in-out infinite; }
      @keyframes br { 0%,100% { transform: scale(1) } 50% { transform: scale(1.03,1.015) } }
    </style>
  </defs>

  <ellipse cx="100" cy="150" rx="80" ry="40" fill="#ff4f9a" opacity="0.2" filter="url(#glow)"/>

  <g class="breathe">
    <g filter="url(#soft)">
      <path fill="url(#body)" d="M22 160 C20 142 44 132 62 140 C66 118 100 112 118 128 C140 118 170 132 170 152 C186 160 176 178 156 176 C140 186 110 188 92 180 C70 188 40 184 30 174 C18 172 16 164 22 160 Z"/>
    </g>
    <!-- 像夜光浮游生物的點點 -->
    <g filter="url(#glow)">
      <circle class="tw" cx="60" cy="150" r="4" fill="url(#spark)"/>
      <circle class="tw t2" cx="100" cy="134" r="5" fill="url(#spark)"/>
      <circle class="tw t3" cx="140" cy="152" r="4" fill="url(#spark)"/>
      <circle class="tw t4" cx="80" cy="170" r="3.5" fill="url(#spark)"/>
      <circle class="tw t2" cx="122" cy="170" r="3.5" fill="url(#spark)"/>
      <circle class="tw t3" cx="40" cy="168" r="3" fill="url(#spark)"/>
      <circle class="tw" cx="158" cy="168" r="3" fill="url(#spark)"/>
      <circle class="tw t4" cx="90" cy="150" r="2.5" fill="url(#spark)"/>
      <circle class="tw t3" cx="120" cy="148" r="2.5" fill="url(#spark)"/>
    </g>
  </g>

  <g fill="#ffb3d6" class="tw t3">
    <circle cx="34" cy="120" r="1.5"/><circle cx="170" cy="118" r="1.4"/><circle cx="110" cy="100" r="1.3"/>
  </g>
</svg>
