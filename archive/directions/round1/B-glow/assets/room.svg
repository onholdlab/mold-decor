<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300">
  <defs>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a3a"/><stop offset="1" stop-color="#1a2450"/>
    </linearGradient>
    <linearGradient id="wallR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2552"/><stop offset="1" stop-color="#101738"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2246"/><stop offset="1" stop-color="#0d1230"/>
    </linearGradient>
    <radialGradient id="moonlight" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9fb8ff" stop-opacity="0.35"/><stop offset="1" stop-color="#9fb8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
    <style>
      .rain { stroke:#7f9bff; stroke-width:1.6; stroke-linecap:round; opacity:.7; animation: rain 1.3s linear infinite; }
      .r2 { animation-delay:-0.45s } .r3 { animation-delay:-0.9s }
      @keyframes rain { from { transform: translateY(-14px); opacity:0 } 30% {opacity:.8} to { transform: translateY(26px); opacity:0 } }
      .blink { animation: blink 2.2s steps(1) infinite; }
      @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:.3 } }
    </style>
  </defs>

  <polygon points="0,0 180,60 180,300 0,300" fill="url(#wallL)"/>
  <polygon points="180,60 360,0 360,300 180,300" fill="url(#wallR)"/>
  <rect x="0" y="252" width="360" height="48" fill="#0d1230"/>
  <polygon points="0,300 180,210 360,300" fill="url(#floor)"/>

  <!-- 窗：有月亮和雨 -->
  <polygon points="236,58 330,32 330,122 236,142" fill="#243a7a"/>
  <circle cx="300" cy="66" r="12" fill="#e8ecff"/>
  <circle cx="306" cy="62" r="10" fill="#243a7a"/>
  <polygon points="241,64 283,52 283,98 241,108" fill="#2b4a96" opacity="0.6"/>
  <polygon points="288,50 325,40 325,90 288,99" fill="#2b4a96" opacity="0.6"/>
  <polygon points="241,112 283,102 283,138 241,146" fill="#2b4a96" opacity="0.6"/>
  <polygon points="288,101 325,92 325,118 288,126" fill="#2b4a96" opacity="0.6"/>
  <g>
    <line class="rain" x1="252" y1="70" x2="250" y2="80"/>
    <line class="rain r2" x1="300" y1="86" x2="298" y2="96"/>
    <line class="rain r3" x1="270" y1="90" x2="268" y2="100"/>
    <line class="rain r2" x1="312" y1="104" x2="310" y2="114"/>
    <line class="rain" x1="258" y1="118" x2="256" y2="128"/>
  </g>
  <!-- 月光灑在地上 -->
  <polygon points="236,142 330,122 300,250 190,250" fill="url(#moonlight)"/>

  <!-- 除濕機（小燈一閃一閃） -->
  <polygon points="24,186 70,172 70,246 24,260" fill="#222c5e"/>
  <polygon points="70,172 92,180 92,254 70,246" fill="#1a2250"/>
  <circle class="blink" cx="60" cy="184" r="2.2" fill="#ff8a65"/>
  <g stroke="#2c3a73" stroke-width="2"><line x1="30" y1="200" x2="64" y2="190"/><line x1="30" y1="208" x2="64" y2="198"/><line x1="30" y1="216" x2="64" y2="206"/></g>

  <!-- 矮桌 + 盤子 + 吐司 -->
  <polygon points="110,236 210,206 262,228 162,258" fill="#2a3468"/>
  <polygon points="110,236 162,258 162,270 110,248" fill="#1b2350"/>
  <polygon points="162,258 262,228 262,240 162,270" fill="#222b5c"/>
  <ellipse cx="180" cy="234" rx="34" ry="14" fill="#3b4680"/>
  <path d="M160 230 q-5 -13 5 -16 q6 -7 16 -3 q10 -4 16 3 q10 3 5 16 z" fill="#5f5a6a"/>

  <!-- 架子 + 玻璃米罐 -->
  <polygon points="262,188 340,168 340,176 262,198" fill="#2a3468"/>
  <path d="M292 188 l0 -36 q0 -5 5 -5 h24 q5 0 5 5 v28 z" fill="#8fb4ff" opacity="0.25"/>
  <path d="M293 147 h34" stroke="#c7d6ff" stroke-width="2" opacity="0.6"/>
</svg>
