<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="body" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#9ffff0"/>
      <stop offset="0.5" stop-color="#2fd6c4"/>
      <stop offset="1" stop-color="#0d6f78"/>
    </radialGradient>
    <radialGradient id="tip" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#b8fff5"/>
      <stop offset="1" stop-color="#2fd6c4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <style>
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.55 } 50% { opacity:1 } }
      .p2 { animation-delay:-1s } .p3 { animation-delay:-2s }
      .sway { transform-origin: 100px 140px; animation: sway 5s ease-in-out infinite; }
      .s2 { animation-delay:-1.7s } .s3 { animation-delay:-3.4s }
      @keyframes sway { 0%,100% { transform: rotate(-3deg) } 50% { transform: rotate(3deg) } }
    </style>
  </defs>

  <!-- 環境光暈 -->
  <circle cx="100" cy="135" r="70" fill="#2fd6c4" opacity="0.22" filter="url(#glow)"/>

  <!-- 珊瑚狀本體：平滑圓潤 -->
  <g filter="url(#soft)">
    <path fill="url(#body)" d="M38 160 C34 130 60 118 74 128 C78 104 112 98 126 120 C150 112 170 134 160 160 C172 172 150 184 134 178 C120 190 90 190 76 178 C58 186 36 176 38 160 Z"/>
  </g>
  <!-- 內部光脈 -->
  <g stroke="#b8fff5" stroke-width="1.4" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M70 150 q20 -20 42 -6 q18 10 30 2"/>
    <path d="M80 168 q22 -8 44 2"/>
  </g>

  <!-- 刷狀孢子柄：光纖感 -->
  <g class="sway">
    <path d="M100 124 V68" stroke="#7df5e5" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <g class="pulse" filter="url(#glow)">
      <circle cx="86" cy="60" r="7" fill="url(#tip)"/><circle cx="100" cy="52" r="8" fill="url(#tip)"/><circle cx="114" cy="60" r="7" fill="url(#tip)"/>
      <circle cx="93" cy="44" r="5" fill="url(#tip)"/><circle cx="107" cy="44" r="5" fill="url(#tip)"/>
    </g>
  </g>
  <g class="sway s2">
    <path d="M66 134 V96" stroke="#7df5e5" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <g class="pulse p2" filter="url(#glow)">
      <circle cx="57" cy="90" r="5" fill="url(#tip)"/><circle cx="66" cy="84" r="6" fill="url(#tip)"/><circle cx="75" cy="90" r="5" fill="url(#tip)"/>
    </g>
  </g>
  <g class="sway s3">
    <path d="M138 136 V100" stroke="#7df5e5" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <g class="pulse p3" filter="url(#glow)">
      <circle cx="129" cy="94" r="5" fill="url(#tip)"/><circle cx="138" cy="88" r="6" fill="url(#tip)"/><circle cx="147" cy="94" r="5" fill="url(#tip)"/>
    </g>
  </g>

  <!-- 漂浮孢子 -->
  <g fill="#b8fff5" class="pulse p2">
    <circle cx="40" cy="110" r="1.6"/><circle cx="160" cy="104" r="1.4"/><circle cx="150" cy="60" r="1.2"/><circle cx="52" cy="70" r="1.2"/>
  </g>
</svg>
