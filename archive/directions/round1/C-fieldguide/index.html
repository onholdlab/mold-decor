<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>黴菌裝潢 · 方向 C 圖鑑手繪</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="hero">
    <p class="eyebrow">方向 C</p>
    <h1>圖鑑手繪</h1>
    <p class="lead">像一本自然觀察筆記。<br>墨線、淡彩、鉛筆標註，每一隻都是一頁圖鑑。</p>
  </header>

  <section class="molds">
    <figure>
      <span class="no">No. 01</span>
      <img src="assets/penicillium.svg" alt="青黴" class="sway">
      <figcaption>
        <b>青黴</b><i>Penicillium</i>
        <span>孢子柄末端分叉如筆刷。常見於麵包、柑橘。青黴素的來源。</span>
      </figcaption>
    </figure>
    <figure>
      <span class="no">No. 02</span>
      <img src="assets/aspergillus.svg" alt="麴菌" class="sway w2">
      <figcaption>
        <b>麴菌</b><i>Aspergillus oryzae</i>
        <span>孢子頭呈球狀放射。釀醬油、味噌、清酒的「米麴」。</span>
      </figcaption>
    </figure>
    <figure>
      <span class="no">No. 03</span>
      <img src="assets/monascus.svg" alt="紅麴" class="sway w3">
      <figcaption>
        <b>紅麴</b><i>Monascus</i>
        <span>在米上長成紅色，即紅麴米。紅糟、紅露酒的顏色由此而來。</span>
      </figcaption>
    </figure>
  </section>

  <section class="room">
    <h2>觀察紀錄：颱風夜的角落</h2>
    <p class="hint">11 月 4 日 · 相對濕度 88% · 室溫 26°C</p>
    <div class="scene">
      <img src="assets/room.svg" alt="" class="bg">
      <img src="assets/penicillium.svg" alt="青黴長在吐司上" class="mold on-bread sway">
      <img src="assets/aspergillus.svg" alt="麴菌爬在牆角" class="mold on-wall sway w2">
      <img src="assets/monascus.svg" alt="紅麴住在米罐裡" class="mold in-jar sway w3">
    </div>
  </section>

  <footer>
    <p>ONHOLDLAB · 黴菌裝潢（暫名）· 美術方向草稿 3／3</p>
  </footer>
</div>
<script src="scroll-lock.js"></script>
</body>
</html>
