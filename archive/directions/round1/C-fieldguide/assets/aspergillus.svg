<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.8"/>
    </filter>
    <style>
      .sway { transform-origin: 100px 150px; animation: sway 7s ease-in-out infinite; }
      .s2 { animation-delay:-2.3s } .s3 { animation-delay:-4.6s }
      @keyframes sway { 0%,100% { transform: rotate(-2deg) } 50% { transform: rotate(2deg) } }
    </style>
  </defs>

  <g filter="url(#wash)" opacity="0.85">
    <path fill="#e8d98a" d="M44 164 C40 140 62 128 78 134 C84 112 116 108 128 128 C152 122 168 142 160 164 C170 176 148 186 134 180 C120 190 88 190 74 180 C56 186 40 178 44 164 Z"/>
    <path fill="#c9c56e" d="M70 176 C90 184 120 184 140 176 C130 186 80 186 70 176 Z"/>
    <circle cx="100" cy="58" r="20" fill="#e8d98a"/>
    <circle cx="64" cy="92" r="13" fill="#e8d98a"/>
    <circle cx="138" cy="96" r="12" fill="#e8d98a"/>
  </g>

  <g filter="url(#wobble)" fill="none" stroke="#3b3024" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 164 C40 140 62 128 78 134 C84 112 116 108 128 128 C152 122 168 142 160 164 C170 176 148 186 134 180 C120 190 88 190 74 180 C56 186 40 178 44 164 Z"/>
    <path d="M52 154 l-5 -3 M60 140 l-4 -5 M76 130 l-2 -6 M96 118 l0 -6 M118 118 l2 -6 M140 128 l4 -5 M156 146 l5 -3 M162 170 l6 1 M142 184 l3 5 M100 192 l0 5 M66 186 l-3 5 M44 174 l-6 2"/>
  </g>

  <!-- 放射狀孢子頭：圓 + 周圍一圈小點 -->
  <g class="sway" filter="url(#wobble)" stroke="#3b3024" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M100 126 V78"/>
    <circle cx="100" cy="58" r="20"/>
    <g fill="#3b3024" stroke="none">
      <circle cx="100" cy="34" r="1.8"/><circle cx="117" cy="41" r="1.8"/><circle cx="124" cy="58" r="1.8"/><circle cx="117" cy="75" r="1.8"/>
      <circle cx="83" cy="75" r="1.8"/><circle cx="76" cy="58" r="1.8"/><circle cx="83" cy="41" r="1.8"/><circle cx="100" cy="82" r="1.8"/>
    </g>
    <path d="M100 38 V40 M114 44 l1 1 M120 58 h-2 M114 72 l1 -1 M86 72 l-1 -1 M80 58 h2 M86 44 l-1 1"/>
  </g>
  <g class="sway s2" filter="url(#wobble)" stroke="#3b3024" stroke-width="1.4" stroke-linecap="round" fill="none">
    <path d="M64 136 V105"/>
    <circle cx="64" cy="92" r="13"/>
    <g fill="#3b3024" stroke="none"><circle cx="64" cy="75" r="1.4"/><circle cx="76" cy="80" r="1.4"/><circle cx="81" cy="92" r="1.4"/><circle cx="52" cy="80" r="1.4"/><circle cx="47" cy="92" r="1.4"/></g>
  </g>
  <g class="sway s3" filter="url(#wobble)" stroke="#3b3024" stroke-width="1.4" stroke-linecap="round" fill="none">
    <path d="M138 138 V108"/>
    <circle cx="138" cy="96" r="12"/>
    <g fill="#3b3024" stroke="none"><circle cx="138" cy="80" r="1.4"/><circle cx="150" cy="85" r="1.4"/><circle cx="154" cy="96" r="1.4"/><circle cx="126" cy="85" r="1.4"/><circle cx="122" cy="96" r="1.4"/></g>
  </g>

</svg>
