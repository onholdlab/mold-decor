<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300">
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/>
    </filter>
    <filter id="wash" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.2"/>
    </filter>
    <style>
      .rain { stroke:#8fa6c4; stroke-width:1.2; stroke-linecap:round; animation: rain 1.6s linear infinite; }
      .r2 { animation-delay:-0.55s } .r3 { animation-delay:-1.1s }
      @keyframes rain { from { transform: translateY(-12px); opacity:0 } 30% {opacity:1} to { transform: translateY(22px); opacity:0 } }
    </style>
  </defs>

  <!-- 水彩淡彩（只上一部分，留白） -->
  <g filter="url(#wash)" opacity="0.55">
    <polygon points="0,0 180,60 180,300 0,300" fill="#d9e3df"/>
    <polygon points="180,60 360,0 360,300 180,300" fill="#eee2cf"/>
    <polygon points="0,300 180,210 360,300" fill="#e3cfae"/>
    <rect x="0" y="252" width="360" height="48" fill="#e3cfae"/>
    <polygon points="236,58 330,32 330,122 236,142" fill="#c9d8ea"/>
  </g>

  <!-- 墨線 -->
  <g filter="url(#wobble)" fill="none" stroke="#3b3024" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 60 V210"/>
    <path d="M0 2 L180 60 L360 2"/>
    <path d="M0 298 L180 210 L360 298"/>
    <!-- 窗 -->
    <polygon points="236,58 330,32 330,122 236,142"/>
    <path d="M283 46 V130 M236 100 L330 78"/>
    <!-- 矮桌 -->
    <polygon points="40,228 150,196 210,222 100,258"/>
    <path d="M40 228 V244 M100 258 V274 M210 222 V236 M150 196 V208"/>
    <ellipse cx="118" cy="230" rx="38" ry="16"/>
    <path d="M96 226 q-6 -14 6 -18 q6 -8 18 -4 q12 -4 18 4 q12 4 6 18 z"/>
    <!-- 牆上的濕度計 -->
    <circle cx="56" cy="92" r="22"/>
    <path d="M56 92 L66 80"/>
    <circle cx="56" cy="92" r="2"/>
    <!-- 架子與米罐 -->
    <path d="M262 190 L340 170"/>
    <path d="M292 188 V152 q0 -5 5 -5 h24 q5 0 5 5 v28"/>
    <path d="M293 147 h34"/>
  </g>

  <!-- 水彩點綴 -->
  <g filter="url(#wash)" opacity="0.7">
    <path d="M100 224 q-3 -10 4 -13 q6 -6 14 -3 q10 -3 14 3 q8 3 4 13 z" fill="#e9cfa5"/>
    <path d="M294 186 V154 h32 v32 z" fill="#f6ecec"/>
  </g>

  <g>
    <line class="rain" x1="252" y1="70" x2="251" y2="78"/>
    <line class="rain r2" x1="300" y1="56" x2="299" y2="64"/>
    <line class="rain r3" x1="270" y1="92" x2="269" y2="100"/>
    <line class="rain r2" x1="312" y1="104" x2="311" y2="112"/>
    <line class="rain" x1="258" y1="118" x2="257" y2="126"/>
  </g>

  <!-- 手寫註記 -->
  <text x="48" y="128" font-size="8" fill="#8c7b67" font-family="serif">RH 88%</text>
  <text x="236" y="156" font-size="7" fill="#8c7b67" font-family="serif">颱風夜，窗邊</text>
</svg>
