<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="body" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#e3fbf6"/>
      <stop offset="0.55" stop-color="#9fe3d4"/>
      <stop offset="1" stop-color="#6cc5b8"/>
    </radialGradient>
    <radialGradient id="tuft" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#f3fffc"/>
      <stop offset="1" stop-color="#8fd8cb"/>
    </radialGradient>
    <filter id="fuzz" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .sway { transform-origin: 100px 140px; animation: sway 4s ease-in-out infinite; }
      .sway2 { animation-delay: -1.3s; }
      .sway3 { animation-delay: -2.6s; }
      @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    </style>
  </defs>

  <!-- 柔光 -->
  <ellipse cx="100" cy="135" rx="70" ry="48" fill="#b8ece0" opacity="0.55" filter="url(#halo)"/>

  <!-- 毛茸茸本體：很多圓重疊 + 位移濾鏡 -->
  <g filter="url(#fuzz)">
    <g fill="url(#body)">
      <circle cx="70" cy="140" r="34"/>
      <circle cx="105" cy="128" r="42"/>
      <circle cx="140" cy="145" r="32"/>
      <circle cx="90" cy="158" r="30"/>
      <circle cx="125" cy="162" r="28"/>
      <circle cx="60" cy="162" r="22"/>
      <circle cx="150" cy="168" r="20"/>
    </g>
  </g>

  <!-- 刷子狀孢子柄（青黴 = 小刷子） -->
  <g class="sway">
    <path d="M100 118 V70" stroke="#7fcfc0" stroke-width="5" stroke-linecap="round"/>
    <g fill="url(#tuft)" filter="url(#fuzz)">
      <circle cx="88" cy="62" r="9"/><circle cx="100" cy="56" r="10"/><circle cx="112" cy="62" r="9"/>
      <circle cx="94" cy="48" r="7"/><circle cx="106" cy="48" r="7"/>
    </g>
  </g>
  <g class="sway sway2">
    <path d="M66 128 V92" stroke="#7fcfc0" stroke-width="4" stroke-linecap="round"/>
    <g fill="url(#tuft)" filter="url(#fuzz)">
      <circle cx="58" cy="86" r="7"/><circle cx="66" cy="80" r="8"/><circle cx="75" cy="86" r="7"/>
    </g>
  </g>
  <g class="sway sway3">
    <path d="M136 132 V96" stroke="#7fcfc0" stroke-width="4" stroke-linecap="round"/>
    <g fill="url(#tuft)" filter="url(#fuzz)">
      <circle cx="128" cy="90" r="7"/><circle cx="136" cy="84" r="8"/><circle cx="145" cy="90" r="7"/>
    </g>
  </g>

  <!-- 睡臉 -->
  <path d="M86 140 q6 6 12 0" stroke="#4f8f84" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M112 140 q6 6 12 0" stroke="#4f8f84" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="82" cy="150" r="5" fill="#ffb3c6" opacity="0.6"/>
  <circle cx="128" cy="150" r="5" fill="#ffb3c6" opacity="0.6"/>
  <path d="M101 150 q4 4 8 0" stroke="#4f8f84" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
