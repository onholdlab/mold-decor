<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300">
  <defs>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e1ff"/><stop offset="1" stop-color="#d9ccfa"/>
    </linearGradient>
    <linearGradient id="wallR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe3d6"/><stop offset="1" stop-color="#ffefe6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e7cf"/><stop offset="1" stop-color="#ecd5b4"/>
    </linearGradient>
    <style>
      .rain { stroke:#bcd6ff; stroke-width:2; stroke-linecap:round; animation: rain 1.4s linear infinite; }
      .r2 { animation-delay:-0.5s } .r3 { animation-delay:-1s }
      @keyframes rain { from { transform: translateY(-14px); opacity:0 } 30% {opacity:1} to { transform: translateY(26px); opacity:0 } }
      .needle { transform-origin: 56px 92px; animation: wob 6s ease-in-out infinite; }
      @keyframes wob { 0%,100% { transform: rotate(-6deg) } 50% { transform: rotate(6deg) } }
    </style>
  </defs>

  <!-- 牆與地板（無任何外框） -->
  <polygon points="0,0 180,60 180,300 0,300" fill="url(#wallL)"/>
  <polygon points="180,60 360,0 360,300 180,300" fill="url(#wallR)"/>
  <polygon points="0,300 180,210 360,300" fill="url(#floor)"/>
  <polygon points="0,300 180,210 360,300 360,300 0,300" fill="url(#floor)"/>
  <!-- 地板延伸到底部 -->
  <rect x="0" y="252" width="360" height="48" fill="#ecd5b4"/>
  <polygon points="0,300 180,210 360,300" fill="url(#floor)"/>

  <!-- 濕度計（左牆） -->
  <circle cx="56" cy="92" r="22" fill="#fff8f0"/>
  <circle cx="56" cy="92" r="17" fill="none" stroke="#e9c9c0" stroke-width="2"/>
  <text x="56" y="126" font-size="8" text-anchor="middle" fill="#b58b7e" font-family="sans-serif">濕度 88%</text>
  <line class="needle" x1="56" y1="92" x2="66" y2="80" stroke="#e5667f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="56" cy="92" r="2.5" fill="#e5667f"/>

  <!-- 窗（右牆），外面下雨 -->
  <polygon points="236,58 330,32 330,122 236,142" fill="#d9ecff"/>
  <polygon points="241,64 283,52 283,98 241,108" fill="#eaf4ff"/>
  <polygon points="288,50 325,40 325,90 288,99" fill="#eaf4ff"/>
  <polygon points="241,112 283,102 283,138 241,146" fill="#eaf4ff"/>
  <polygon points="288,101 325,92 325,118 288,126" fill="#eaf4ff"/>
  <g>
    <line class="rain" x1="252" y1="70" x2="250" y2="80"/>
    <line class="rain r2" x1="300" y1="56" x2="298" y2="66"/>
    <line class="rain r3" x1="270" y1="90" x2="268" y2="100"/>
    <line class="rain r2" x1="312" y1="100" x2="310" y2="110"/>
    <line class="rain" x1="258" y1="118" x2="256" y2="128"/>
  </g>

  <!-- 矮桌 + 盤子 + 吐司 -->
  <polygon points="40,228 150,196 210,222 100,258" fill="#f3d9bb"/>
  <polygon points="40,228 100,258 100,272 40,242" fill="#dcbb94"/>
  <polygon points="100,258 210,222 210,236 100,272" fill="#e6c9a6"/>
  <ellipse cx="118" cy="230" rx="38" ry="16" fill="#fffdf8"/>
  <ellipse cx="118" cy="230" rx="30" ry="12" fill="#f7f1e6"/>
  <!-- 吐司 -->
  <path d="M96 226 q-6 -14 6 -18 q6 -8 18 -4 q12 -4 18 4 q12 4 6 18 z" fill="#f6dcb0"/>
  <path d="M102 226 q-3 -10 4 -13 q6 -6 14 -3 q10 -3 14 3 q8 3 4 13 z" fill="#fbead0"/>

  <!-- 小盆栽（讓角落有生活感） -->
  <path d="M296 196 l8 36 h20 l8 -36 z" fill="#ffd1c2"/>
  <ellipse cx="314" cy="196" rx="18" ry="6" fill="#ffb6a0"/>
  <path d="M314 194 q-18 -26 -4 -44 q14 18 4 44 z" fill="#a8dcc3"/>
  <path d="M314 194 q4 -26 24 -34 q-6 22 -24 34 z" fill="#bfe8d2"/>
</svg>
