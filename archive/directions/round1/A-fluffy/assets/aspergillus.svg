<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="body" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.55" stop-color="#f3e08a"/>
      <stop offset="1" stop-color="#cfc25a"/>
    </radialGradient>
    <radialGradient id="pom" cx="40%" cy="38%" r="65%">
      <stop offset="0" stop-color="#fff9d6"/>
      <stop offset="0.6" stop-color="#e9d86b"/>
      <stop offset="1" stop-color="#b9b24e"/>
    </radialGradient>
    <filter id="fuzz" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="1.0" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .bob { animation: bob 3.6s ease-in-out infinite; }
      .b2 { animation-delay: -1.2s; } .b3 { animation-delay: -2.4s; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    </style>
  </defs>

  <ellipse cx="100" cy="140" rx="68" ry="44" fill="#f6e9a6" opacity="0.6" filter="url(#halo)"/>

  <g filter="url(#fuzz)">
    <g fill="url(#body)">
      <circle cx="72" cy="150" r="30"/>
      <circle cx="105" cy="140" r="40"/>
      <circle cx="138" cy="152" r="30"/>
      <circle cx="95" cy="166" r="26"/>
      <circle cx="125" cy="168" r="24"/>
    </g>
  </g>

  <!-- 球狀孢子頭（麴菌 = 灑水器狀的圓頭） -->
  <g class="bob">
    <path d="M100 122 V66" stroke="#d6c86a" stroke-width="5" stroke-linecap="round"/>
    <g filter="url(#fuzz)">
      <circle cx="100" cy="58" r="20" fill="url(#pom)"/>
      <g fill="#fff6c8" opacity="0.9">
        <circle cx="90" cy="50" r="4"/><circle cx="104" cy="44" r="4"/><circle cx="114" cy="56" r="4"/>
        <circle cx="94" cy="66" r="4"/><circle cx="110" cy="68" r="3.5"/><circle cx="84" cy="60" r="3.5"/>
      </g>
    </g>
  </g>
  <g class="bob b2">
    <path d="M64 136 V98" stroke="#d6c86a" stroke-width="4" stroke-linecap="round"/>
    <g filter="url(#fuzz)">
      <circle cx="64" cy="90" r="14" fill="url(#pom)"/>
      <g fill="#fff6c8" opacity="0.9"><circle cx="57" cy="84" r="3"/><circle cx="68" cy="81" r="3"/><circle cx="72" cy="94" r="3"/><circle cx="60" cy="98" r="3"/></g>
    </g>
  </g>
  <g class="bob b3">
    <path d="M140 136 V102" stroke="#d6c86a" stroke-width="4" stroke-linecap="round"/>
    <g filter="url(#fuzz)">
      <circle cx="140" cy="94" r="13" fill="url(#pom)"/>
      <g fill="#fff6c8" opacity="0.9"><circle cx="134" cy="88" r="3"/><circle cx="146" cy="86" r="3"/><circle cx="148" cy="99" r="3"/><circle cx="134" cy="101" r="3"/></g>
    </g>
  </g>

  <!-- 睡臉 -->
  <path d="M86 150 q6 6 12 0" stroke="#8c7f2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M112 150 q6 6 12 0" stroke="#8c7f2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="82" cy="160" r="5" fill="#ffb3a0" opacity="0.55"/>
  <circle cx="128" cy="160" r="5" fill="#ffb3a0" opacity="0.55"/>
  <ellipse cx="105" cy="161" rx="3" ry="2.2" fill="#8c7f2e"/>
</svg>
