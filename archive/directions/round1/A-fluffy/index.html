<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>黴菌裝潢 · 方向 A 毛絨粉彩</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="hero">
    <p class="eyebrow">方向 A</p>
    <h1>毛絨粉彩</h1>
    <p class="lead">黴菌是一團團會呼吸的絨毛球，<br>像抱枕、像小寵物，睡在你的房間裡。</p>
  </header>

  <section class="molds">
    <figure>
      <img src="assets/penicillium.svg" alt="青黴" class="float">
      <figcaption>
        <b>青黴</b><i>Penicillium</i>
        <span>孢子柄長得像小刷子，愛涼涼濕濕的麵包和橘子。</span>
      </figcaption>
    </figure>
    <figure>
      <img src="assets/aspergillus.svg" alt="麴菌" class="float f2">
      <figcaption>
        <b>麴菌</b><i>Aspergillus oryzae</i>
        <span>圓圓的孢子頭，醬油、味噌、清酒都靠它。</span>
      </figcaption>
    </figure>
    <figure>
      <img src="assets/monascus.svg" alt="紅麴" class="float f3">
      <figcaption>
        <b>紅麴</b><i>Monascus</i>
        <span>長在米上會把整碗染成粉紅色，紅糟就是它。</span>
      </figcaption>
    </figure>
  </section>

  <section class="room">
    <h2>颱風天的房間角落</h2>
    <p class="hint">濕度 88%，三隻都長得很好。</p>
    <div class="scene">
      <img src="assets/room.svg" alt="" class="bg">
      <img src="assets/penicillium.svg" alt="青黴長在吐司上" class="mold on-bread">
      <img src="assets/aspergillus.svg" alt="麴菌爬在牆角" class="mold on-wall">
      <img src="assets/monascus.svg" alt="紅麴鋪在地板當地毯" class="mold on-floor">
    </div>
  </section>

  <footer>
    <p>ONHOLDLAB · 黴菌裝潢（暫名）· 美術方向草稿 1／3</p>
  </footer>
</div>
<script src="scroll-lock.js"></script>
</body>
</html>
