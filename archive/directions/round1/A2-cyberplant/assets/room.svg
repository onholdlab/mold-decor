<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300">
  <defs>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1f24"/><stop offset="1" stop-color="#15303a"/>
    </linearGradient>
    <linearGradient id="wallR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2f3f"/><stop offset="1" stop-color="#0d1a25"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17303a"/><stop offset="1" stop-color="#0a1419"/>
    </linearGradient>
    <linearGradient id="growlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity="0.45"/><stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </linearGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .flicker { animation: fl 3s steps(1) infinite; }
      @keyframes fl { 0%,100%{opacity:1} 47%{opacity:1} 48%{opacity:.5} 50%{opacity:1} 83%{opacity:1} 84%{opacity:.7} 86%{opacity:1} }
      .rain { stroke:#37f0e6; stroke-width:1.4; stroke-linecap:round; opacity:.6; animation: rain 1.2s linear infinite; }
      .r2 { animation-delay:-0.4s } .r3 { animation-delay:-0.8s }
      @keyframes rain { from { transform: translateY(-14px); opacity:0 } 30% {opacity:.7} to { transform: translateY(26px); opacity:0 } }
      .scan { animation: scan 4s linear infinite; }
      @keyframes scan { from { transform: translateY(-4px) } to { transform: translateY(28px) } }
    </style>
  </defs>

  <polygon points="0,0 180,60 180,300 0,300" fill="url(#wallL)"/>
  <polygon points="180,60 360,0 360,300 180,300" fill="url(#wallR)"/>
  <rect x="0" y="252" width="360" height="48" fill="#0a1419"/>
  <polygon points="0,300 180,210 360,300" fill="url(#floor)"/>

  <!-- 牆角 LED 燈條（青色） -->
  <path d="M180 60 V210" stroke="#37f0e6" stroke-width="2" filter="url(#neon)" class="flicker"/>
  <path d="M0 300 L180 210 L360 300" stroke="#37f0e6" stroke-width="1.5" fill="none" opacity="0.7" filter="url(#neon)"/>

  <!-- 植物燈（粉紫）掛在天花板，往下打光 -->
  <polygon points="60,22 170,58 170,64 60,28" fill="#2a3a44"/>
  <polygon points="60,28 170,64 170,67 60,31" fill="#ff4fd8" filter="url(#neon)"/>
  <polygon points="60,31 170,67 220,250 20,250" fill="url(#growlight)"/>

  <!-- 窗：霓虹招牌 + 雨 -->
  <polygon points="236,58 330,32 330,122 236,142" fill="#0b1b2e"/>
  <polygon points="241,64 325,40 325,118 241,146" fill="#102540"/>
  <g filter="url(#neon)" class="flicker">
    <text x="258" y="96" font-size="14" fill="#ff4fd8" font-family="monospace" font-weight="bold" transform="skewY(-12)">24H</text>
    <path d="M252 104 h60" stroke="#37f0e6" stroke-width="2" transform="skewY(-12)"/>
  </g>
  <g>
    <line class="rain" x1="252" y1="70" x2="250" y2="80"/>
    <line class="rain r2" x1="300" y1="56" x2="298" y2="66"/>
    <line class="rain r3" x1="270" y1="92" x2="268" y2="102"/>
    <line class="rain r2" x1="312" y1="104" x2="310" y2="114"/>
  </g>

  <!-- 全息濕度面板（左牆） -->
  <polygon points="38,84 100,100 100,140 38,124" fill="#37f0e6" opacity="0.12"/>
  <polygon points="38,84 100,100 100,140 38,124" fill="none" stroke="#37f0e6" stroke-width="1" opacity="0.8" filter="url(#neon)"/>
  <text x="46" y="110" font-size="12" fill="#37f0e6" font-family="monospace" font-weight="bold" transform="skewY(14)">RH 88%</text>
  <text x="46" y="121" font-size="6" fill="#9ff7f1" font-family="monospace" transform="skewY(14)">TYPHOON MODE</text>
  <rect class="scan" x="38" y="84" width="62" height="2" fill="#37f0e6" opacity="0.5" transform="skewY(14)"/>

  <!-- 金屬層架 + 米罐 + 植栽 -->
  <polygon points="248,184 340,160 340,166 248,190" fill="#2a3a44"/>
  <path d="M250 190 V250 M338 166 V236" stroke="#2a3a44" stroke-width="3"/>
  <path d="M262 184 V150 q0 -5 5 -5 h22 q5 0 5 5 v26" fill="#37f0e6" opacity="0.18"/>
  <path d="M263 145 h32" stroke="#9ff7f1" stroke-width="2" opacity="0.7"/>

  <!-- 矮桌（深色金屬）+ 盤子 + 吐司 -->
  <polygon points="40,228 150,196 210,222 100,258" fill="#213640"/>
  <polygon points="40,228 100,258 100,272 40,242" fill="#13232b"/>
  <polygon points="100,258 210,222 210,236 100,272" fill="#1b2f38"/>
  <ellipse cx="118" cy="230" rx="38" ry="16" fill="#2c4650"/>
  <path d="M96 226 q-6 -14 6 -18 q6 -8 18 -4 q12 -4 18 4 q12 4 6 18 z" fill="#8c7a5a"/>
</svg>
