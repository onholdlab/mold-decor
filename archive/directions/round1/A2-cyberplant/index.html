<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a1419">
<title>黴菌裝潢 · 方向 A2 毛絨 × 霓虹植栽</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="hero">
    <p class="eyebrow">方向 A2 // FLUFF.NEON.PLANT</p>
    <h1>毛絨 × 霓虹植栽</h1>
    <p class="lead">雨下不停的賽博公寓，植物燈徹夜亮著。<br>絨毛黴菌和黃金葛一起住進來，誰也不趕誰。</p>
  </header>

  <section class="molds">
    <figure>
      <img src="assets/penicillium.svg" alt="青黴" class="float rim-cyan">
      <figcaption>
        <b>青黴</b><i>Penicillium</i>
        <span>孢子柄像小刷子，涼涼濕濕的吐司是它的床。</span>
      </figcaption>
    </figure>
    <figure>
      <img src="assets/aspergillus.svg" alt="麴菌" class="float f2 rim-pink">
      <figcaption>
        <b>麴菌</b><i>Aspergillus oryzae</i>
        <span>圓圓的孢子頭，醬油、味噌、清酒都靠它。</span>
      </figcaption>
    </figure>
    <figure>
      <img src="assets/monascus.svg" alt="紅麴" class="float f3 rim-pink">
      <figcaption>
        <b>紅麴</b><i>Monascus</i>
        <span>長在米上會把整罐染成粉紅色，紅糟就是它。</span>
      </figcaption>
    </figure>
  </section>

  <section class="room">
    <h2>颱風夜 · 植物燈全開</h2>
    <p class="hint">RH 88% / 24H 招牌還亮著 / 黃金葛長得比黴菌快</p>
    <div class="scene">
      <img src="assets/room.svg" alt="" class="bg">
      <span class="light l-pink"></span>
      <span class="light l-cyan"></span>
      <img src="assets/penicillium.svg" alt="青黴長在吐司上" class="mold on-bread rim-cyan">
      <img src="assets/aspergillus.svg" alt="麴菌爬在牆角 LED 旁" class="mold on-wall rim-pink">
      <img src="assets/monascus.svg" alt="紅麴住在米罐裡" class="mold in-jar rim-pink">
      <img src="assets/plants.svg" alt="" class="plants">
    </div>
  </section>

  <footer>
    <p>ONHOLDLAB · 黴菌裝潢（暫名）· 美術方向 A 變體</p>
  </footer>
</div>
<script src="scroll-lock.js"></script>
</body>
</html>
